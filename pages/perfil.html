<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare Planner | Mis Mascotas</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">🐾 PetCare Planner</div>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./agenda.html">Agenda</a></li>
                <li><a href="./perfil.html">Mis Mascotas</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h1>Registrar Nueva Mascota</h1>
            <form id="form-mascota">
                <div class="form-group">
                    <label for="nombre-mascota">Nombre de la mascota</label>
                    <input type="text" id="nombre-mascota" placeholder="Ej: Firulais" required>
                </div>

                <div class="form-group">
                    <label for="tipo-mascota">Especie</label>
                    <select id="tipo-mascota" required>
                        <option value="" disabled selected>Seleccioná una opción</option>
                        <option value="perro">Perro</option>
                        <option value="gato">Gato</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="form-group" id="grupo-especie-extra" style="display: none;">
                    <label for="especie-extra">¿Qué mascota tenés?</label>
                    <input type="text" id="especie-extra" placeholder="Ej: Conejo, Tortuga">
                </div>

                <div class="form-group">
                    <label for="foto-mascota">URL de la foto (Opcional)</label>
                    <input type="url" id="foto-mascota" placeholder="https://ejemplo.com/foto.jpg">
                </div>

                <button type="submit" class="btn-primary">Guardar Mascota</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Mis Mascotas Registradas</h2>
            <div id="mascotas-container" class="grid-container">
                <p class="empty-state">Todavía no registraste ninguna mascota.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 PetCare Planner</p>
    </footer>

    <script src="../assets/js/main.js"></script>
</body>
</html>
